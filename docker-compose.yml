services:
  mysql:
    image: mysql:8.4
    container_name: travel-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: travel_platform
      MYSQL_ROOT_PASSWORD: travel
      MYSQL_USER: travel
      MYSQL_PASSWORD: travel
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utravel", "-ptravel"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - travel_mysql_data:/var/lib/mysql

volumes:
  travel_mysql_data:
